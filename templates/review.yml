# WHAT: GitLab CI/CD component inputs for the standalone reviewer job.
# WHY: Catalog consumers should pin the component ref, not a clone override.
# WHO: A GitLab project that includes this file as a CI component.
# WHERE: templates/review.yml in this repository when mirrored to GitLab.
# HOW: Declare the stage input only, then define the review job after the banner.

spec:
  inputs:
    stage:
      default: .post

---

# WHAT: Component review job that clones this bot at a shipped SHA.
# WHY: Product pipelines need a required reviewer without a job-level repo override.
# WHO: merge_request_event pipelines that include this component.
# WHERE: The including project's .post stage unless inputs.stage is changed.
# HOW: Install curl and git, refuse debug trace, fetch the pinned SHA, run the helper.
review:
  stage: $[[ inputs.stage ]]
  image: python:3.12
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git
    - |
      if [ -n "${CI_DEBUG_TRACE:-}" ]; then
        echo "Refusing to run: CI_DEBUG_TRACE is on and would leak GITLAB_REVIEWER_TOKEN." >&2
        exit 1
      fi
    - git init .gitlab-mr-reviewer
    - git -C .gitlab-mr-reviewer remote add origin https://github.com/KRNichols/gitlab-mr-reviewer.git
    - git -C .gitlab-mr-reviewer fetch --depth 1 origin 729142a06db2ebba555fd58e243507d78e0510f6
    - git -C .gitlab-mr-reviewer checkout --detach FETCH_HEAD
  script:
    - python3 .gitlab-mr-reviewer/scripts/review_mr.py
