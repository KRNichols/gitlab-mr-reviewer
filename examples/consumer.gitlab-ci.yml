# Example: include the standalone reviewer after your product jobs.
# Copy the include block. Do not copy this whole file unless it matches your stages.

include:
  - remote: "https://raw.githubusercontent.com/KRNichols/gitlab-mr-reviewer/main/.gitlab-ci-include.yml"

# Do not set GITLAB_REVIEWER_REPO or GITLAB_REVIEWER_REF on the review job.
# Bump the bot by taking a newer include file (it ships a new SHA pin).

# Your product jobs go in earlier stages. The included review job uses stage .post
# with when: always so a red backend/frontend/quality/build/node-audit still unapproves.
