# WHAT: Drop-in review job another GitLab project can include remotely.
# WHY: Consumers should not copy the Python helper by hand.
# WHO: A product pipeline that wants this bot as a required MR reviewer.
# WHERE: include: remote of this file from the consumer .gitlab-ci.yml.
# HOW: Clone this repo at the shipped SHA and run the helper against CI_PROJECT_DIR.
#
# Consumers bump the pin by taking a newer copy of THIS file from the bot
# default branch (or bumping their remote include). Do not set job-level
# GITLAB_REVIEWER_REPO or GITLAB_REVIEWER_REF — those are ignored here.

# WHAT: Reviewer job that runs last and still unapproves on a red product gate.
# WHY: .post is a built-in GitLab stage, so consumers need not declare review.
# WHO: merge_request_event pipelines on the including project.
# WHERE: Included into the consumer pipeline after their product jobs.
# HOW: Clone the pinned SHA, refuse CI_DEBUG_TRACE, then exec the helper.
review:
  stage: .post
  image: python:3.12
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git
    - |
      if [ -n "${CI_DEBUG_TRACE:-}" ]; then
        echo "Refusing to run: CI_DEBUG_TRACE is on and would leak GITLAB_REVIEWER_TOKEN." >&2
        exit 1
      fi
    # Pin: bump this SHA when cutting a bot release. Not a CI variable.
    - git init .gitlab-mr-reviewer
    - git -C .gitlab-mr-reviewer remote add origin https://github.com/KRNichols/gitlab-mr-reviewer.git
    - git -C .gitlab-mr-reviewer fetch --depth 1 origin db45b6d4224d162f40059a639bc52cb82cf95bad
    - git -C .gitlab-mr-reviewer checkout --detach FETCH_HEAD
  script:
    - python3 .gitlab-mr-reviewer/scripts/review_mr.py
